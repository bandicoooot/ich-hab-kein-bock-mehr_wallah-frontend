<div class="vehicles-container">
  <h1>🚗 Unsere Fahrzeuge</h1>

  <div class="filters">
    <label for="status">Filter nach Status:</label>
    <select id="status" (change)="filterByStatus($event)">
      <option value="Alle">Alle</option>
      <option value="Verfügbar">Verfügbar</option>
      <option value="Reserviert">Reserviert</option>
      <option value="Verkauft">Verkauft</option>
    </select>
  </div>

  <div class="vehicle-grid">
    <div class="vehicle-card" *ngFor="let car of filteredVehicles">
      <h2>{{ car.brand }} {{ car.type }}</h2>
      <p><strong>Farbe:</strong> {{ car.color }}</p>
      <p><strong>Ausstattung:</strong> {{ car.features }}</p>
      <p class="status {{ car.status | lowercase }}"><strong>Status:</strong> {{ car.status }}</p>
    </div>
  </div>
</div>
